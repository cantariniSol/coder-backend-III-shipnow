components:
  schemas:
    RootHealthResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: ShipNow API está corriendo y lista para recibir peticiones
        environment:
          type: string
          example: development
        port:
          type: string
          example: "3001"
        url:
          type: string
          example: http://localhost:3001

    DetailedHealthResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        environment:
          type: string
          example: production
        uptime:
          type: number
          example: 123.45
        timestamp:
          type: string
          format: date-time
          example: "2026-08-31T12:00:00.000Z"