paths:
  /api/mocks/mockingUsers:
    get:
      tags:
        - Mocks
      summary: Obtener usuarios mock
      description: Devuelve usuarios de prueba generados dinámicamente.
      parameters:
        - name: quantity
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 1
          description: Cantidad de usuarios mock a generar
      responses:
        '200':
          description: Usuarios mock generados
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    type: array
                    items:
                      type: object
                      properties:
                        firstName:
                          type: string
                        lastName:
                          type: string
                        email:
                          type: string
        '400':
          description: Cantidad inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/mocks/generateUsers:
    post:
      tags:
        - Mocks
      summary: Generar usuarios mock
      description: Inserta usuarios de prueba en la base de datos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                users:
                  type: integer
                  example: 1
      responses:
        '201':
          description: Usuarios creados
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    type: object
                    properties:
                      users:
                        type: integer
                        example: 1
        '400':
          description: Body inválido o cantidad inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
