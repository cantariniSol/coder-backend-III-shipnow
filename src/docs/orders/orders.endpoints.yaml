paths:
  /api/orders:
    get:
      tags:
        - Orders
      summary: Obtener todos los pedidos
      description: Recupera una página de pedidos registrados.
      parameters:
        - name: page
          in: query
          description: Número de página (mínimo 1).
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Cantidad de resultados por página (entre 1 y 50).
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: Lista de pedidos
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                        example: 1
                      limit:
                        type: integer
                        example: 10
                      total:
                        type: integer
                        example: 42
                      totalPages:
                        type: integer
                        example: 5
        "400":
          description: Parámetros de paginación inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags:
        - Orders
      summary: Crear pedido
      description: Crea un nuevo pedido verificando usuario, tienda e items.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreate"
      responses:
        "201":
          description: Pedido creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    $ref: "#/components/schemas/Order"
        "400":
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Usuario o tienda no encontrados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/orders/{oid}:
    parameters:
      - name: oid
        in: path
        required: true
        schema:
          type: string
        description: ID del pedido

    get:
      tags:
        - Orders
      summary: Obtener pedido por ID
      description: Recupera un pedido específico a partir de su ID.
      responses:
        "200":
          description: Pedido encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    $ref: "#/components/schemas/Order"
        "400":
          description: ID inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      tags:
        - Orders
      summary: Actualizar pedido
      description: Actualiza los datos de un pedido, incluido estado y prioridad.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpdate"
      responses:
        "200":
          description: Pedido actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    $ref: "#/components/schemas/Order"
        "400":
          description: Error de validación o estado inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags:
        - Orders
      summary: Eliminar pedido
      description: Elimina un pedido existente.
      responses:
        "200":
          description: Pedido eliminado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    $ref: "#/components/schemas/Order"
        "400":
          description: ID inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/orders/{oid}/proof:
    parameters:
      - name: oid
        in: path
        required: true
        schema:
          type: string
        description: ID del pedido

    post:
      tags:
        - Orders
      summary: Cargar comprobante de pedido
      description: Guarda un comprobante PDF, JPG o PNG y registra sus metadatos en el pedido.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - proof
              properties:
                proof:
                  type: string
                  format: binary
                  description: Archivo PDF, JPG o PNG de hasta 5 MB.
      responses:
        "201":
          description: Comprobante cargado y asociado al pedido
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    $ref: "#/components/schemas/Order"
        "400":
          description: Archivo faltante, tipo de archivo inválido o tamaño excedido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"