paths:
  /api/mocks/loggerTest:
    get:
      tags:
        - Logger
      summary: Prueba de logger
      description: Endpoint de validación del logger, no es funcionalidad de negocio.
      responses:
        '200':
          description: Logger ejecutado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Logger test ejecutado. Revisa consola y archivo de logs.
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'