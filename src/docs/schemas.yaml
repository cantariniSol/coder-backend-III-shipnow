components:
  schemas:
    SuccessResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        payload:
          type: object

    ErrorDetail:
      type: object
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: El body de la petición es obligatorio y debe ser un objeto JSON
        details:
          nullable: true
          example: null

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: Datos inválidos
        error:
          $ref: "#/components/schemas/ErrorDetail"